<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Система Охотника</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div id="app">
        <!-- Системное сообщение -->
        <div id="system-message" class="hidden">
            <div class="msg-text"></div>
            <button>Принять</button>
        </div>

        <header>
            <h1 class="neon-text">⚔️ Система Охотника</h1>
            <div id="rank" class="rank-badge">Ранг: E</div>
        </header>
        <main>
            <!-- Ежедневные задания -->
            <section id="daily-quests" class="panel">
                <h2>📋 Ежедневные задания</h2>
                <ul id="quest-list"></ul>
            </section>

            <!-- Тренировка дня (показывается только в ПН/ВТ/ПТ) -->
            <section id="training-panel" class="panel training-panel hidden">
                <h2>🏋️ Тренировка дня</h2>
                <div id="training-content"></div>
                <button id="complete-training" onclick="completeTraining()">✅ Завершить тренировку</button>
            </section>

            <!-- Статистика -->
            <section id="stats" class="panel">
                <h2>📊 Статистика</h2>
                <div class="stat-row">
                    <span class="stat-label">Уровень</span>
                    <span id="level" class="stat-value">1</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Опыт</span>
                    <span><span id="exp">0</span> / <span id="exp-max">100</span></span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Дней подряд</span>
                    <span id="streak" class="streak-fire">🔥 0</span>
                </div>
                <div class="progress-bar">
                    <div id="exp-bar" class="progress-fill" style="width: 0%"></div>
                </div>

                <!-- Характеристики -->
                <div class="attributes-section">
                    <h3>✨ Характеристики</h3>
                    <div id="attr-points" class="attr-points">Доступно очков: 0</div>
                    <div class="attr-row">
                        <span class="attr-label">💪 Сила</span>
                        <span id="attr-strength" class="attr-value">0</span>
                        <button class="attr-btn" data-attr="strength">+</button>
                    </div>
                    <div class="attr-row">
                        <span class="attr-label">🧠 Интеллект</span>
                        <span id="attr-intelligence" class="attr-value">0</span>
                        <button class="attr-btn" data-attr="intelligence">+</button>
                    </div>
                    <div class="attr-row">
                        <span class="attr-label">🏃 Выносливость</span>
                        <span id="attr-endurance" class="attr-value">0</span>
                        <button class="attr-btn" data-attr="endurance">+</button>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <small>Только ты решаешь, станешь ли сильнее</small>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
